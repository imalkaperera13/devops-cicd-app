apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-cicd-app
  template:
    metadata:
      labels:
        app: devops-cicd-app
    spec:
      containers:
      - name: devops-cicd-app
        image: imalkaprojectacr2.azurecr.io/devops-cicd-app:v1
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: devops-cicd-app
spec:
  type: LoadBalancer
  ports:
  - port: 8080
  selector:
    app: devops-cicd-app