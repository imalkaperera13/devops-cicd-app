name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Run tests
      run: |
        pip install pytest
        pytest test_app.py -v

    - name: Login to Azure ACR
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and Push to ACR
      run: |
        docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/devops-cicd-app:v1 .
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/devops-cicd-app:v1